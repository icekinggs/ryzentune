[project]
name = "ryzentune"
dynamic = ["version"]
description = "Assistente de overclock de memória e Curve Optimizer para Ryzen AM4"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"ryzentune/sistema.py" = ["E501"]  # XML da tarefa agendada

[tool.pytest.ini_options]
testpaths = ["tests"]
