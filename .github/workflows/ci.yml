name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependências
        run: python -m pip install -r requirements-build.txt
      - name: Lint
        run: python -m ruff check ryzentune tests RyzenTune.py
      - name: Testes
        run: python -m pytest -q
