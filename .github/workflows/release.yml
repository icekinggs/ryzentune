name: Release

# Disparado por uma tag vX.Y.Z (o script lancar.ps1 cria e envia a tag).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Conferir que a tag bate com a versão do código
        shell: pwsh
        run: |
          $v = (Select-String ryzentune/versao.py -Pattern '__version__\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} diferente da versão $v" }
          "VERSAO=$v" >> $env:GITHUB_ENV

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (lint, testes, PyInstaller, autoteste, instalador)
        shell: pwsh
        run: ./build.ps1

      - name: Notas da versão (do CHANGELOG.md)
        shell: pwsh
        run: |
          $texto = Get-Content -Raw -Encoding UTF8 CHANGELOG.md
          $m = [regex]::Match($texto, "(?ms)^## \[$([regex]::Escape($env:VERSAO))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md sem a seção [$env:VERSAO]" }
          $m.Groups[1].Value.Trim() | Set-Content -Encoding UTF8 notas.md

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/RyzenTune-Setup-$env:VERSAO.exe" "dist/RyzenTune-Setup-$env:VERSAO.exe.sha256" `
            --title "RyzenTune $env:VERSAO" --notes-file notas.md
